[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrogue-emergent"
version = "0.1.0"
description = "A modular reference engine for traditional roguelikes with emergent gameplay."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DeepMind Agentic Engineering" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
